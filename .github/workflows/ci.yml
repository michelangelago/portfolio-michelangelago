
name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portfolio
        run: python3 build.py

      - name: Validate generated files
        run: |
          test -f dist/index.html
          test -f dist/pt/index.html
          test -f dist/en/index.html
          test -f dist/fr/index.html
          test -f dist/de/index.html
          test -f dist/assets/style.css
